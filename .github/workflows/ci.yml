name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked --dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - name: Check formatting without rewriting preserved baseline files
        run: >-
          uv run ruff format --check .
          --exclude tests/security/test_ssrf.py
      - run: uv run mypy src tests
      - name: Verify generated schemas
        shell: bash
        run: |
          uv run python scripts/generate_schema_snapshots.py
          git diff --exit-code -- tests/snapshots
      - name: Build wheel and sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run python -m build
      - name: Smoke-test built wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          PATH="$RUNNER_TEMP/wheel-smoke/bin:$PATH" yandex-workspace-mcp doctor
          "$RUNNER_TEMP/wheel-smoke/bin/python" scripts/check_tool_matrix.py
      - name: Build and smoke-test locked container
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          docker build --tag yandex-workspace-mcp:ci .
          docker run --rm yandex-workspace-mcp:ci doctor

  redis-contract:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked --dev --extra multi-user
      - run: uv run pytest -q tests/integration/test_redis_token_store.py
