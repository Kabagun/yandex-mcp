[project]
name = "yandex-workspace-mcp"
version = "0.2.0"
description = "Multi-user MCP server with isolated Yandex Disk and Mail profiles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "anyio>=4.4.0",
    "cryptography>=44",
]

[project.optional-dependencies]
multi-user = ["redis>=5"]

[project.scripts]
yandex-workspace-mcp = "yandex_workspace_mcp.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
